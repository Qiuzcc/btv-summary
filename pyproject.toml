[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btv-summary"
version = "0.1.0"
description = "Bilibili long-video summarizer: subtitles first, Whisper fallback, chunked LLM summary"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.1.1",
]

[project.scripts]
btv = "btv.cli:main"

[tool.setuptools.packages.find]
include = ["btv*"]
