name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # resources/ 下的二进制被 .gitignore 排除，CI 需自行下载。
      # mac 产物含 arm64/x64 两种 dmg，ffmpeg 用 lipo 合成 universal 二进制。
      - name: 准备随包二进制（yt-dlp + universal ffmpeg）
        run: |
          set -euo pipefail
          mkdir -p resources
          curl -fL --retry 3 -o resources/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -fL --retry 3 -o /tmp/ffmpeg-arm64 \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64
          curl -fL --retry 3 -o /tmp/ffmpeg-x64 \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64
          lipo -create /tmp/ffmpeg-arm64 /tmp/ffmpeg-x64 -output resources/ffmpeg
          chmod +x resources/yt-dlp resources/ffmpeg

      - run: pnpm pack:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 固定文件名，使 releases/latest/download/<文件名> 永远指向最新版
      - name: 重命名为固定文件名
        run: |
          set -euo pipefail
          cd release
          for f in *arm64.dmg; do mv "$f" btv-summary-mac-arm64.dmg; done
          for f in *x64.dmg; do mv "$f" btv-summary-mac-x64.dmg; done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.dmg

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 准备随包二进制（yt-dlp + ffmpeg）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          curl -fL --retry 3 -o resources/yt-dlp.exe \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -fL --retry 3 -o resources/ffmpeg.exe \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64

      - run: pnpm pack:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 重命名为固定文件名
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in *.exe; do mv "$f" btv-summary-win-x64-setup.exe; done

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
